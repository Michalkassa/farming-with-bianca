		<style>
@font-face {
	font-family: "Fredoka";
	src: url("Fredoka.ttf") format("truetype");
	font-weight: 300 700;
	font-display: swap;
}

:root {
	--bg: #1d140d;
	--panel: #2a1c10;
	--wood: #573a24;
	--gold: #ffdb73;
	--text: #f1e3c4;
	--muted: #b89b74;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
	background: var(--bg);
	overflow: hidden;
	overscroll-behavior: none;
}

body {
	color: var(--text);
	font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* ---- loading screen ---- */
#status {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	background: var(--bg);
	transition: opacity 0.35s ease;
	z-index: 10;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-icon {
	width: 104px;
	height: 96px;
	animation: heartbeat 1.4s ease-in-out infinite;
}

@keyframes heartbeat {
	0%, 40%, 100% { transform: scale(1); }
	12% { transform: scale(1.14); }
	26% { transform: scale(1.06); }
}

#status-title {
	font-size: 34px;
	font-weight: 600;
	letter-spacing: 0.04em;
	color: var(--gold);
	text-shadow: 0 2px 0 #000;
}

#status-bar {
	width: min(60vw, 320px);
	height: 18px;
	background: var(--panel);
	border: 3px solid var(--wood);
	border-radius: 6px;
	overflow: hidden;
}

#status-fill {
	width: 0%;
	height: 100%;
	background: linear-gradient(180deg, #ffe38f, #d59a3c);
	transition: width 0.15s linear;
}

#status-fill.indeterminate {
	width: 35%;
	animation: slide 1.2s ease-in-out infinite;
}

@keyframes slide {
	0% { transform: translateX(-100%); }
	100% { transform: translateX(300%); }
}

#status-label {
	font-size: 14px;
	color: var(--muted);
}

#status-notice {
	display: none;
	max-width: min(80vw, 480px);
	padding: 14px 18px;
	background: #5b2b2b;
	border: 2px solid #9b3943;
	border-radius: 8px;
	line-height: 1.4;
	text-align: center;
}

/* ---- mobile: rotate prompt + fullscreen button ---- */
#rotate, #fs {
	display: none;
}

@media (pointer: coarse) {
	#fs {
		position: fixed;
		top: max(10px, env(safe-area-inset-top));
		right: max(10px, env(safe-area-inset-right));
		width: 44px;
		height: 44px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: rgba(29, 20, 13, 0.7);
		border: 2px solid var(--wood);
		border-radius: 8px;
		color: var(--gold);
		z-index: 5;
	}

	#fs.unsupported, html:fullscreen #fs, body.loading #fs {
		display: none;
	}

	#fs svg {
		width: 22px;
		height: 22px;
	}
}

@media (pointer: coarse) and (orientation: portrait) {
	#rotate {
		position: fixed;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		gap: 20px;
		background: var(--bg);
		text-align: center;
		padding: 24px;
		z-index: 20;
	}

	#rotate svg {
		width: 72px;
		height: 72px;
		animation: turn 2s ease-in-out infinite;
	}

	@keyframes turn {
		0%, 20% { transform: rotate(0deg); }
		60%, 100% { transform: rotate(-90deg); }
	}

	#rotate strong {
		font-size: 22px;
		color: var(--gold);
	}

	#rotate span {
		color: var(--muted);
	}
}

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":390132,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusFill = document.getElementById('status-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const fsButton = document.getElementById('fs');

	function hideStatus() {
		statusOverlay.classList.add('done');
		document.body.classList.remove('loading');
		setTimeout(() => statusOverlay.remove(), 400);
	}

	function showFailure(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		statusNotice.replaceChildren();
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
		statusFill.classList.remove('indeterminate');
		statusFill.style.width = '0%';
		statusLabel.textContent = 'Could not start the game.';
	}

	// ---- fullscreen + landscape lock on touch devices ----
	// Browsers only honour orientation.lock() while fullscreen, so both go together.
	function lockLandscape() {
		if (screen.orientation && typeof screen.orientation.lock === 'function') {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}

	function enterFullscreen() {
		const root = document.documentElement;
		const request = root.requestFullscreen || root.webkitRequestFullscreen;
		if (!request) {
			return;
		}
		Promise.resolve(request.call(root, { navigationUI: 'hide' })).then(lockLandscape).catch(() => {});
	}

	if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
		fsButton.classList.add('unsupported');
	}
	fsButton.addEventListener('click', enterFullscreen);
	document.addEventListener('fullscreenchange', () => {
		if (document.fullscreenElement) {
			lockLandscape();
		}
	});
	// First tap after loading tries to go fullscreen automatically; the button covers later returns.
	window.addEventListener('touchend', () => {
		if (!document.body.classList.contains('loading')) {
			enterFullscreen();
		}
	}, { once: true, passive: true });

	// ---- boot ----
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showFailure('This browser is missing features needed to run the game:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusFill.classList.remove('indeterminate');
				statusFill.style.width = Math.round((current / total) * 100) + '%';
				statusLabel.textContent = 'Loading… ' + Math.round((current / total) * 100) + '%';
			} else {
				statusFill.classList.add('indeterminate');
				statusLabel.textContent = 'Starting…';
			}
		},
	}).then(hideStatus, showFailure);
}());
